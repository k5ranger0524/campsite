name: monitor-normal (30分ごと)

on:
  # 止めるときは、targets.yml の normal 対象を enabled: false にするのと同時に
  # この2行もコメントアウトすること（対象が空のまま動くと exit 1 のメールが届き続ける）
  schedule:
    # 30分ごと (UTC)。GitHubのスケジュールは混雑時に遅延することがある。
    # 毎時0分・30分は全世界の定期実行が集中して取りこぼされやすいので、7分・37分にずらす。
    # ※ schedule を戻したのに定期実行が1回も起きないときは、この cron の値を少し
    #   書き換えてpushし直すと登録し直される（2026-10-14 に実際に起きた）
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      test_notify:
        description: '通知テスト（空き状況に関わらず通知を1回送る）'
        type: boolean
        default: false

permissions:
  contents: write

# state を押し合わないよう、同時に1つしか走らせない
concurrency:
  group: monitor-normal
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: 空き状況をチェック
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # 入力を直接シェルに展開しない（インジェクション対策）
          TEST_NOTIFY: ${{ inputs.test_notify }}
        run: |
          if [ "$TEST_NOTIFY" = "true" ]; then
            python3 monitor.py --group normal --state state.json --test-notify
          else
            python3 monitor.py --group normal --state state.json
          fi

      - name: state.json を保存
        # 通知の有無に関わらず保存する。
        # monitor.py は正常にパースできた時しか state.json を書かないので、
        # 異常終了(exit 1)の回はファイルが変化せず、誤った状態はコミットされない。
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: bash scripts/push-state.sh state.json "$BRANCH" "update state"
