# 監視対象の一覧。
#
# 同じ予約システム（adapter）の別施設を足すときは、ここにブロックを1つ増やすだけでよい。
# 未対応の予約システムを足すときは adapters/ にモジュールを1つ書く。
#
# 対象に何を書けばよいか分からないときは discover.py で洗い出せる:
#     python3 discover.py --adapter ban489 --facility <施設名> --date 2026-09-19

defaults:
  repeat_hours: 2        # 空きが続く間、何時間ごとに再通知するか
  group: normal          # 確認頻度のグループ（下記）

# group で確認頻度を選ぶ。ワークフローが --group で拾うので、
# 対象を増やすときにワークフロー側を触る必要はない。
#   normal … 30分ごと (.github/workflows/akagi.yml)
#   fast   … 1回の起動で55分間・3分おき (.github/workflows/haneda.yml)
#            空きが数分で消える対象向け。
#            ※ 現在 fast の対象はすべて停止中で、定期実行も止めてある

targets:
  - id: akagi-family
    name: 赤城山オートキャンプ場 3家族サイト
    adapter: ban489
    date: 2026-09-19
    enabled: false
    group: normal
    config:
      facility: autocamp-akagi
      items:
        F1: room_24246
        # F2 は対象外。戻すときはこの行のコメントを外す
        # F2: room_24247
        F3: room_24248
        F4: room_24249

  # 例) 同じ489banの別施設を足す場合（facility と items を差し替えるだけ）
  # - id: example-camp
  #   name: 別のキャンプ場
  #   adapter: ban489
  #   date: 2026-10-10
  #   config:
  #     facility: example-slug
  #     items:
  #       A1: room_12345

  # ---------------------------------------------------------------------
  # ここから下は現在すべて停止中（enabled: false）。
  # そのため fast グループは空になっており、haneda.yml の定期実行も止めてある。
  # 再開するときは enabled を true に戻したうえで、
  # .github/workflows/haneda.yml の schedule のコメントも外すこと。
  # 設定・アダプタはそのまま残してあるので、日付を書き換えれば別の旅程にも使える。
  # 停止中でも手動での動作確認はできる:
  #     python3 monitor.py --target haneda-parking
  # ---------------------------------------------------------------------

  - id: haneda-parking
    name: 羽田空港 P2駐車場
    adapter: haneda_parking
    enabled: false
    # 8/22〜25 の4日すべてが空いたときだけ通知する（下の dates と同じ日数）。
    # 1日だけ、あるいは3日だけ空いても通知しない（8/22 単独も通知しない）。
    min_available: 4
    # 空きが十数分で消えるため短い間隔で確認する
    group: fast
    config:
      areas:
        P2: { id: 0, name: 第2駐車場(P2/第1ターミナル) }
        # P3も見たくなったら次の行のコメントを外すだけでよい
        # P3: { id: 1, name: 第3駐車場(P3/第2ターミナル) }
      dates: [2026-08-22, 2026-08-23, 2026-08-24, 2026-08-25]
      handicapped: 0
      # 混雑も「空きあり」として通知する
      status_map:
        konzatsu: available
    # 条件をゆるめたい場合:
    #   min_available: 3               # 3日以上そろえば通知
    #   priority_dates: [2026-08-22]   # この日だけは単独でも通知（今は使っていない）
    #   min_available: 1               # 1日でも空けば通知

  - id: haneda-p4
    name: 羽田空港 P4駐車場
    adapter: haneda_p4p5
    enabled: false
    group: fast
    # 8/22〜25 のうち、同じ種別で3日以上空いたときに通知する
    min_available: 3
    # ただし 8/22 だけは1日でも通知する
    priority_dates: [2026-08-22]
    config:
      url: https://haneda-p4.jp/airport/
      kinds:
        一般: public
        個室: private
      dates: [2026-08-22, 2026-08-23, 2026-08-24, 2026-08-25]
      # 混雑もアダプタ既定で「空きあり」扱い（身障者枠はkindsに入れないので対象外）

  - id: haneda-p5
    name: 羽田空港 P5駐車場
    adapter: haneda_p4p5
    enabled: false
    group: fast
    # 8/22〜25 のうち、同じ種別で3日以上空いたときに通知する
    min_available: 3
    # ただし 8/22 だけは1日でも通知する
    priority_dates: [2026-08-22]
    config:
      url: https://pk-reserve.haneda-airport.jp/airport/entrance/0000.jsf
      kinds:
        一般: public
        個室: private
      dates: [2026-08-22, 2026-08-23, 2026-08-24, 2026-08-25]

  - id: henna-hotel-haneda
    name: 変なホテル東京羽田駐車場
    adapter: btimes
    date: 2026-08-22
    enabled: false
    # 羽田周辺はキャンセルが数分で消えるため短い間隔で確認する
    group: fast
    min_available: 1
    config:
      pref: tokyo
      park_id: 55937
      name: 変なホテル東京羽田駐車場
      # 予約可能日数は14日。監視開始が早いと目的日はまだ表に出てこないので、
      # それを異常にせず「受付不可」として正常終了させる
      allow_out_of_range: true

  - id: harmony-haneda-west
    name: ハーモニーレジデンス羽田ウエスト駐車場
    adapter: btimes
    date: 2026-08-22
    enabled: false
    group: fast
    min_available: 1
    config:
      pref: tokyo
      park_id: 43295
      name: ハーモニーレジデンス羽田ウエスト駐車場
      allow_out_of_range: true
